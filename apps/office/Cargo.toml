[package]
name = "nixe-office"
version = "0.1.0"
description = "Write, Sheets and Present: documents, spreadsheets and slides for Omarchy"
license = "MIT"
repository = "https://github.com/design-nexus/nixe-office"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nixe-office"
path = "src/main.rs"

[dependencies]
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "87682e6c936b6a4f006639b1a1c099e96346c07c" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "b8204de80644e263e32783602f2e0ae393578c9e" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "b8204de80644e263e32783602f2e0ae393578c9e" }
anyhow = "1.0.104"
cairo-rs = { version = "0.22", features = ["pdf", "png", "v1_16"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
libspelling = "0.5"
pangocairo = "0.22"
pulldown-cmark = { version = "0.13", default-features = false }
roxmltree = "0.21"
rust_xlsxwriter = { version = "0.99", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sourceview5 = "0.11"
toml = "1.1.6"
zip = { version = "8", default-features = false, features = ["deflate"] }
